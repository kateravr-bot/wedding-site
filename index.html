<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSVP Γάμος</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="rsvpPage">
    <section class="heroMedia" aria-label="Εικόνα RSVP">
      <img class="heroImg" src="assets/finale_rsvp1.png" alt="RSVP γάμου" />
    </section>

    <section class="heroText" aria-label="Φόρμα RSVP">
      <div class="heroRight">
        <div class="panel">
          <div id="rsvpContent">
            <form id="rsvpForm" class="form" action="https://formsubmit.co/TO_EMAIL_SOU" method="POST">
              <div class="field">
                <label class="label">Ονοματεπώνυμο <span class="req">(υποχρεωτικό)</span></label>
                <input class="input" type="text" name="Όνομα" placeholder="Ονοματεπώνυμο" required />
              </div>

              <div class="field">
                <label class="label">Θα παρευρεθείτε στον γάμο; <span class="req">(υποχρεωτικό)</span></label>
                <div class="choices">
                  <label class="choice">
                    <input type="radio" name="Παρουσία" value="Ναι" required />
                    <span>Ναι</span>
                  </label>
                  <label class="choice">
                    <input type="radio" name="Παρουσία" value="Όχι" required />
                    <span>Όχι</span>
                  </label>
                </div>
              </div>

              <div class="field">
                <label class="label">Πόσα άτομα θα είστε;</label>
                <input class="input" id="guestsCount" type="number" name="Άτομα" min="0" max="10" placeholder="2" value="1" />
                <p class="help">Αν επιλέξετε «Όχι», το πεδίο γίνεται αυτόματα 0.</p>
              </div>

              <div class="field">
                <label class="label">Υπάρχουν παιδιά; <span class="req">(υποχρεωτικό)</span></label>
                <div class="choices">
                  <label class="choice">
                    <input type="radio" name="Παιδιά" value="Όχι" checked />
                    <span>Όχι</span>
                  </label>
                  <label class="choice">
                    <input type="radio" name="Παιδιά" value="Ναι" />
                    <span>Ναι</span>
                  </label>
                </div>

                <div class="kids-ages">
                  <label class="label label--sub">Αν ναι, γράψτε ηλικίες</label>
                  <input class="input" type="text" name="Ηλικίες παιδιών" placeholder="π.χ. 4 και 7" />
                </div>
              </div>

              <div class="field">
                <label class="label">Σχόλια</label>
                <textarea class="textarea" name="Σχόλια" rows="4"></textarea>
              </div>

              <input type="hidden" name="_subject" value="Νέο RSVP" />
              <input type="hidden" name="_template" value="table" />
              <input type="hidden" name="_autoresponse" value="Σας ευχαριστούμε θερμά για την απάντησή σας στον γάμο μας!" />

              <button class="btn btn--wide" type="submit">Υποβολή</button>
            </form>

            <p id="closed" class="error" style="display:none;">Το RSVP έχει κλείσει.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function syncGuestsCountWithAttendance() {
      const attendingNo = document.querySelector('input[name="Παρουσία"][value="Όχι"]')?.checked;
      const guests = document.getElementById("guestsCount");
      if (!guests) return;

      if (attendingNo) {
        guests.value = "0";
        guests.min = "0";
        guests.max = "0";
        guests.readOnly = true;
        guests.classList.add("locked");
      } else {
        guests.min = "1";
        guests.max = "10";
        guests.readOnly = false;
        guests.classList.remove("locked");
        if (guests.value === "0") guests.value = "1";
      }
    }

    document.querySelectorAll('input[name="Παρουσία"]').forEach((el) => {
      el.addEventListener("change", syncGuestsCountWithAttendance);
    });
    syncGuestsCountWithAttendance();

    const deadline = new Date("2026-07-10T23:59:59");
    if (new Date() > deadline) {
      const form = document.getElementById("rsvpForm");
      const closed = document.getElementById("closed");
      if (form && closed) {
        form.style.display = "none";
        closed.style.display = "block";
      }
    }
  </script>
</body>
</html>
