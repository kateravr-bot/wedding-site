<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RSVP Γάμος</title>
  <link rel="stylesheet" href="style.css?v=yellow-brown-rsvp-20260530-2" />
</head>

<body>
  <main class="rsvpPage" aria-label="RSVP γάμου">
    <section class="formStage" aria-label="Φόρμα RSVP">
      <div class="rsvpCard">
        <header class="cardHeader">
          <p class="eyebrow">RSVP</p>
          <h1>Επιβεβαίωση παρουσίας</h1>
          <div class="monogram">Κ &amp; Γ</div>
        </header>

        <div id="rsvpContent">
          <form id="rsvpForm" class="form" action="https://docs.google.com/forms/d/e/1FAIpQLSc-FSvKEY1499QWkTmzYSTOFIFHxrF7_jV68O7r18IClrXN2Q/formResponse" method="POST" target="hidden_iframe" accept-charset="UTF-8">
            <div class="field field--wide">
              <label class="label">Ονοματεπώνυμο <span class="req">*</span></label>
              <input class="input" type="text" name="entry.921213476" placeholder="Ονοματεπώνυμο" required />
            </div>

            <div class="field">
              <label class="label">Θα παρευρεθείτε; <span class="req">*</span></label>
              <div class="choices">
                <label class="choice">
                  <input type="radio" name="entry.415043231" value="Ναι" required />
                  <span>Ναι</span>
                </label>
                <label class="choice">
                  <input type="radio" name="entry.415043231" value="Όχι" required />
                  <span>Όχι</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label">Άτομα</label>
              <input class="input" id="guestsCount" type="number" name="entry.369662035" min="0" max="10" placeholder="2" value="1" />
            </div>

            <div class="field">
              <label class="label">Υπάρχουν παιδιά; <span class="req">*</span></label>
              <div class="choices">
                <label class="choice">
                  <input type="radio" name="entry.173540478" value="Όχι" checked />
                  <span>Όχι</span>
                </label>
                <label class="choice">
                  <input type="radio" name="entry.173540478" value="Ναι" />
                  <span>Ναι</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label">Ηλικίες παιδιών</label>
              <input class="input" type="text" name="entry.1887314842" placeholder="π.χ. 4 και 7" />
            </div>

            <div class="field field--wide">
              <label class="label">Σχόλια</label>
              <textarea class="textarea" name="entry.807278448" rows="3"></textarea>
            </div>


            <button class="btn field--wide" type="submit">Υποβολή</button>
          </form>

          <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
          <p id="thanks" class="error" style="display:none;">Σας ευχαριστούμε θερμά για την απάντησή σας!</p>
          <p id="closed" class="error" style="display:none;">Το RSVP έχει κλείσει.</p>
        </div>
      </div>
    </section>

    <section class="decorStage" aria-label="Διακοσμητική ενότητα με ηλιοτρόπια">
      <img class="sunflowerMark sunflowerMark--left" src="assets/sunflower-bg.png" alt="" aria-hidden="true" />
      <img class="sunflowerMark sunflowerMark--right" src="assets/sunflower-bg.png" alt="" aria-hidden="true" />

      <div class="decorPanel">
        <img class="decorImage" src="assets/sunflower-bg.png" alt="Ηλιοτρόπια και μονόγραμμα Κ και Γ" />
      </div>
    </section>
  </main>

  <script>
    let submitted = false;

    function syncGuestsCountWithAttendance() {
      const attendingNo = document.querySelector('input[name="entry.415043231"][value="Όχι"]')?.checked;
      const guests = document.getElementById("guestsCount");
      if (!guests) return;

      if (attendingNo) {
        guests.value = "0";
        guests.min = "0";
        guests.max = "0";
        guests.readOnly = true;
        guests.classList.add("locked");
      } else {
        guests.min = "1";
        guests.max = "10";
        guests.readOnly = false;
        guests.classList.remove("locked");
        if (guests.value === "0") guests.value = "1";
      }
    }

    document.querySelectorAll('input[name="entry.415043231"]').forEach((el) => {
      el.addEventListener("change", syncGuestsCountWithAttendance);
    });
    syncGuestsCountWithAttendance();

    const rsvpForm = document.getElementById("rsvpForm");
    const hiddenIframe = document.getElementById("hidden_iframe");
    const thanks = document.getElementById("thanks");

    if (rsvpForm) {
      rsvpForm.addEventListener("submit", () => {
        submitted = true;
        const submitButton = rsvpForm.querySelector('button[type="submit"]');
        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = "Αποστολή...";
        }
      });
    }

    if (hiddenIframe) {
      hiddenIframe.addEventListener("load", () => {
        if (!submitted) return;
        if (rsvpForm) rsvpForm.style.display = "none";
        if (thanks) thanks.style.display = "block";
      });
    }

    const deadline = new Date("2026-07-10T23:59:59");
    if (new Date() > deadline) {
      const form = document.getElementById("rsvpForm");
      const closed = document.getElementById("closed");
      if (form && closed) {
        form.style.display = "none";
        closed.style.display = "block";
      }
    }
  </script>
</body>
</html>
