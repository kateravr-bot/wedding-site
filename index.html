<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RSVP Γάμος</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="rsvpPage" aria-label="RSVP γάμου">
    <!-- Αριστερά: μόνο η εικόνα, χωρίς περιθώρια -->
    <section class="imageSide" aria-label="Εικόνα RSVP">
      <img class="rsvpImage" src="assets/finale_rsvp1.png" alt="RSVP γάμου" />
    </section>

    <!-- Δεξιά: φόρμα RSVP -->
    <section class="formSide" aria-label="Φόρμα RSVP">
      <div class="formFit" id="formFit">
        <section class="formCard" id="formCard">
          <form id="rsvpForm" class="form" action="https://formsubmit.co/TO_EMAIL_SOU" method="POST">
            <div class="field">
              <label class="label" for="guestName">Ονοματεπώνυμο <span class="req">*</span></label>
              <input id="guestName" class="input" type="text" name="Όνομα" placeholder="Ονοματεπώνυμο" required />
            </div>

            <div class="field">
              <label class="label">Θα παρευρεθείτε; <span class="req">*</span></label>
              <div class="choices twoCols">
                <label class="choice">
                  <input type="radio" name="Παρουσία" value="Ναι" required />
                  <span>Ναι</span>
                </label>
                <label class="choice">
                  <input type="radio" name="Παρουσία" value="Όχι" required />
                  <span>Όχι</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label" for="guestsCount">Άτομα</label>
              <input id="guestsCount" class="input" type="number" name="Άτομα" min="0" max="10" placeholder="2" value="1" />
            </div>

            <div class="field">
              <label class="label">Υπάρχουν παιδιά; <span class="req">*</span></label>
              <div class="choices twoCols">
                <label class="choice">
                  <input type="radio" name="Παιδιά" value="Όχι" checked />
                  <span>Όχι</span>
                </label>
                <label class="choice">
                  <input type="radio" name="Παιδιά" value="Ναι" />
                  <span>Ναι</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label" for="kidsAges">Ηλικίες παιδιών</label>
              <input id="kidsAges" class="input" type="text" name="Ηλικίες παιδιών" placeholder="π.χ. 4 και 7" />
            </div>

            <div class="field commentsField">
              <label class="label" for="comments">Σχόλια</label>
              <textarea id="comments" class="textarea" name="Σχόλια" rows="3"></textarea>
            </div>

            <input type="hidden" name="_subject" value="Νέο RSVP" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_autoresponse" value="Σας ευχαριστούμε θερμά για την απάντησή σας στον γάμο μας!" />

            <button class="btn" type="submit">Υποβολή</button>
          </form>

          <p id="closed" class="closed" style="display:none;">Το RSVP έχει κλείσει.</p>
        </section>
      </div>
    </section>
  </main>

  <script>
    function syncGuestsCountWithAttendance() {
      const attendingNo = document.querySelector('input[name="Παρουσία"][value="Όχι"]')?.checked;
      const guests = document.getElementById("guestsCount");
      if (!guests) return;

      if (attendingNo) {
        guests.value = "0";
        guests.min = "0";
        guests.max = "0";
        guests.readOnly = true;
        guests.classList.add("locked");
      } else {
        guests.min = "1";
        guests.max = "10";
        guests.readOnly = false;
        guests.classList.remove("locked");
        if (guests.value === "0") guests.value = "1";
      }
    }

    document.querySelectorAll('input[name="Παρουσία"]').forEach((el) => {
      el.addEventListener("change", syncGuestsCountWithAttendance);
    });
    syncGuestsCountWithAttendance();

    const deadline = new Date("2026-07-10T23:59:59");
    if (new Date() > deadline) {
      const form = document.getElementById("rsvpForm");
      const closed = document.getElementById("closed");
      if (form && closed) {
        form.style.display = "none";
        closed.style.display = "block";
      }
    }

    // Κρατά τη φόρμα μέσα στη δεξιά πλευρά χωρίς να ενεργοποιείται scroll.
    // Σε πολύ μικρές οθόνες τη μικραίνει αναλογικά, αλλά δεν αλλάζει ποτέ διάταξη.
    function fitFormToScreen() {
      const side = document.querySelector(".formSide");
      const fit = document.getElementById("formFit");
      const card = document.getElementById("formCard");
      if (!side || !fit || !card) return;

      fit.style.transform = "scale(1)";
      fit.style.width = "430px";

      const availableWidth = side.clientWidth - 16;
      const availableHeight = side.clientHeight - 16;
      const cardWidth = card.offsetWidth;
      const cardHeight = card.offsetHeight;

      const scale = Math.min(1, availableWidth / cardWidth, availableHeight / cardHeight);
      fit.style.transform = `scale(${Math.max(scale, 0.48)})`;
    }

    window.addEventListener("load", fitFormToScreen);
    window.addEventListener("resize", fitFormToScreen);
    window.addEventListener("orientationchange", () => setTimeout(fitFormToScreen, 250));
  </script>
</body>
</html>
