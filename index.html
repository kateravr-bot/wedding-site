<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RSVP Γάμος</title>
  <link rel="stylesheet" href="style.css?v=yellow-brown-rsvp-20260530-2" />
</head>

<body>
  <main class="rsvpPage" aria-label="RSVP γάμου">
    <section class="formStage" aria-label="Φόρμα RSVP">
      <div class="rsvpCard">
        <header class="cardHeader">
          <p class="eyebrow">RSVP</p>
          <h1>Επιβεβαίωση παρουσίας</h1>
          <div class="monogram">Κ &amp; Γ</div>
        </header>

        <div id="rsvpContent">
          <form id="rsvpForm" class="form" action="https://formsubmit.co/kat.avramidou@gmail.com" method="POST">
            <div class="field field--wide">
              <label class="label">Ονοματεπώνυμο <span class="req">*</span></label>
              <input class="input" type="text" name="Όνομα" placeholder="Ονοματεπώνυμο" required />
            </div>

            <div class="field">
              <label class="label">Θα παρευρεθείτε; <span class="req">*</span></label>
              <div class="choices">
                <label class="choice">
                  <input type="radio" name="Παρουσία" value="Ναι" required />
                  <span>Ναι</span>
                </label>
                <label class="choice">
                  <input type="radio" name="Παρουσία" value="Όχι" required />
                  <span>Όχι</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label">Άτομα</label>
              <input class="input" id="guestsCount" type="number" name="Άτομα" min="0" max="10" placeholder="2" value="1" />
            </div>

            <div class="field">
              <label class="label">Υπάρχουν παιδιά; <span class="req">*</span></label>
              <div class="choices">
                <label class="choice">
                  <input type="radio" name="Παιδιά" value="Όχι" checked />
                  <span>Όχι</span>
                </label>
                <label class="choice">
                  <input type="radio" name="Παιδιά" value="Ναι" />
                  <span>Ναι</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label">Ηλικίες παιδιών</label>
              <input class="input" type="text" name="Ηλικίες παιδιών" placeholder="π.χ. 4 και 7" />
            </div>

            <div class="field field--wide">
              <label class="label">Σχόλια</label>
              <textarea class="textarea" name="Σχόλια" rows="3"></textarea>
            </div>

            <input type="hidden" name="_subject" value="Νέο RSVP" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_autoresponse" value="Σας ευχαριστούμε θερμά για την απάντησή σας στον γάμο μας!" />

            <button class="btn field--wide" type="submit">Υποβολή</button>
          </form>

          <p id="closed" class="error" style="display:none;">Το RSVP έχει κλείσει.</p>
        </div>
      </div>
    </section>

    <section class="decorStage" aria-label="Διακοσμητική ενότητα με ηλιοτρόπια">
      <img class="sunflowerMark sunflowerMark--left" src="assets/sunflower-bg.png" alt="" aria-hidden="true" />
      <img class="sunflowerMark sunflowerMark--right" src="assets/sunflower-bg.png" alt="" aria-hidden="true" />

      <div class="decorPanel">
        <img class="decorImage" src="assets/sunflower-bg.png" alt="Ηλιοτρόπια και μονόγραμμα Κ και Γ" />
      </div>
    </section>
  </main>

  <script>
    function syncGuestsCountWithAttendance() {
      const attendingNo = document.querySelector('input[name="Παρουσία"][value="Όχι"]')?.checked;
      const guests = document.getElementById("guestsCount");
      if (!guests) return;

      if (attendingNo) {
        guests.value = "0";
        guests.min = "0";
        guests.max = "0";
        guests.readOnly = true;
        guests.classList.add("locked");
      } else {
        guests.min = "1";
        guests.max = "10";
        guests.readOnly = false;
        guests.classList.remove("locked");
        if (guests.value === "0") guests.value = "1";
      }
    }

    document.querySelectorAll('input[name="Παρουσία"]').forEach((el) => {
      el.addEventListener("change", syncGuestsCountWithAttendance);
    });
    syncGuestsCountWithAttendance();

    const deadline = new Date("2026-07-10T23:59:59");
    if (new Date() > deadline) {
      const form = document.getElementById("rsvpForm");
      const closed = document.getElementById("closed");
      if (form && closed) {
        form.style.display = "none";
        closed.style.display = "block";
      }
    }
  </script>
</body>
</html>
