<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RSVP Γάμος</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="rsvpPage" aria-label="RSVP γάμου">
    <section class="imageSide" aria-label="Εικόνα RSVP">
      <img class="rsvpImage" src="assets/finale_rsvp1.png" alt="RSVP γάμου" />
    </section>

    <section class="formSide" aria-label="Φόρμα RSVP">
      <div class="formCard">
        <form id="rsvpForm" class="rsvpForm" action="https://formsubmit.co/TO_EMAIL_SOU" method="POST">
          <div class="field">
            <label class="label" for="guestName">Ονοματεπώνυμο <span class="req">*</span></label>
            <input id="guestName" class="input" type="text" name="Όνομα" placeholder="Ονοματεπώνυμο" required />
          </div>

          <div class="field">
            <label class="label">Θα παρευρεθείτε στον γάμο; <span class="req">*</span></label>
            <div class="choices">
              <label class="choice">
                <input type="radio" name="Παρουσία" value="Ναι" required />
                <span>Ναι</span>
              </label>
              <label class="choice">
                <input type="radio" name="Παρουσία" value="Όχι" required />
                <span>Όχι</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label class="label" for="guestsCount">Πόσα άτομα θα είστε;</label>
            <input id="guestsCount" class="input" type="number" name="Άτομα" min="0" max="10" placeholder="2" value="1" />
          </div>

          <div class="field">
            <label class="label">Υπάρχουν παιδιά; <span class="req">*</span></label>
            <div class="choices">
              <label class="choice">
                <input type="radio" name="Παιδιά" value="Όχι" checked />
                <span>Όχι</span>
              </label>
              <label class="choice">
                <input type="radio" name="Παιδιά" value="Ναι" />
                <span>Ναι</span>
              </label>
            </div>
          </div>

          <div class="field optionalField">
            <label class="label" for="kidsAges">Ηλικίες παιδιών, αν υπάρχουν</label>
            <input id="kidsAges" class="input" type="text" name="Ηλικίες παιδιών" placeholder="π.χ. 4 και 7" />
          </div>

          <div class="field optionalField commentsField">
            <label class="label" for="comments">Σχόλια</label>
            <textarea id="comments" class="textarea" name="Σχόλια" rows="2"></textarea>
          </div>

          <input type="hidden" name="_subject" value="Νέο RSVP" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_autoresponse" value="Σας ευχαριστούμε θερμά για την απάντησή σας στον γάμο μας!" />

          <button class="btn" type="submit">Υποβολή</button>
        </form>

        <p id="closed" class="closed" hidden>Το RSVP έχει κλείσει.</p>
      </div>
    </section>
  </main>

  <script>
    function syncGuestsCountWithAttendance() {
      const attendingNo = document.querySelector('input[name="Παρουσία"][value="Όχι"]')?.checked;
      const guests = document.getElementById("guestsCount");
      if (!guests) return;

      if (attendingNo) {
        guests.value = "0";
        guests.min = "0";
        guests.max = "0";
        guests.readOnly = true;
        guests.classList.add("locked");
      } else {
        guests.min = "1";
        guests.max = "10";
        guests.readOnly = false;
        guests.classList.remove("locked");
        if (guests.value === "0") guests.value = "1";
      }
    }

    document.querySelectorAll('input[name="Παρουσία"]').forEach((el) => {
      el.addEventListener("change", syncGuestsCountWithAttendance);
    });
    syncGuestsCountWithAttendance();

    const deadline = new Date("2026-07-10T23:59:59");
    if (new Date() > deadline) {
      const form = document.getElementById("rsvpForm");
      const closed = document.getElementById("closed");
      if (form && closed) {
        form.hidden = true;
        closed.hidden = false;
      }
    }
  </script>
</body>
</html>
